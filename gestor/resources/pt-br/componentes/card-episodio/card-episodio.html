<!--
    Componente: Card de Episódio (Cyber Emerald)
    Marcadores: #numero#, #titulo#, #descricao#, #url#, #duracao#, #status-classe#, #status-texto#
    Estados suportados: disponível (emerald) e em breve (amber, com ícone de relógio e link desabilitado).
-->
<article class="c2f-card group relative flex h-full flex-col overflow-hidden rounded-2xl border border-white/5 bg-[#0a1510]/80 p-6 transition-all duration-300 hover:-translate-y-1.5 hover:border-emerald-500/40 hover:shadow-[0_20px_50px_-20px_rgba(16,185,129,0.45)]">
    <div class="pointer-events-none absolute -right-16 -top-16 h-40 w-40 rounded-full bg-emerald-500/10 blur-3xl transition-opacity duration-500 opacity-0 group-hover:opacity-100"></div>
    <div class="flex items-start justify-between gap-4">
        <span class="font-mono text-4xl font-black leading-none text-emerald-500/30 transition-colors duration-300 group-hover:text-emerald-400/60">#numero#</span>
        <span class="#status-classe#">#status-texto#</span>
    </div>
    <h3 class="mt-5 text-lg font-extrabold leading-snug text-white">#titulo#</h3>
    <p class="mt-3 flex-1 text-sm leading-relaxed text-slate-400">#descricao#</p>
    <div class="mt-6 flex items-center justify-between border-t border-white/5 pt-4">
        <span class="inline-flex items-center gap-1.5 text-xs font-bold text-slate-500">
            <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>#duracao#
        </span>
        <a href="#url#" target="_blank" rel="noopener" class="inline-flex items-center gap-1.5 text-sm font-extrabold text-emerald-300 transition-all duration-300 group-hover:gap-2.5 hover:text-emerald-200">
            Assistir<svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </a>
    </div>
</article>
