<!--
    Componente: Badge Luminoso (pill translúcido com ponto pulsante)
    Marcadores: #texto#
    Variante padrão esmeralda. Para "em breve" troque emerald por amber nas classes de cor.
-->
<span class="inline-flex items-center gap-2 rounded-full border border-emerald-500/30 bg-emerald-500/10 px-4 py-1.5 text-xs font-bold uppercase tracking-widest text-emerald-300 shadow-[0_0_20px_-6px_rgba(52,211,153,0.6)] backdrop-blur-sm">
    <span class="relative flex h-2 w-2">
        <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-emerald-400 opacity-75"></span>
        <span class="relative inline-flex h-2 w-2 rounded-full bg-emerald-400"></span>
    </span>
    #texto#
</span>
