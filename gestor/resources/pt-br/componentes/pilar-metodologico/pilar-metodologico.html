<!--
    Componente: Pilar Metodológico (card de filosofia pedagógica)
    Marcadores: #indice#, #icone-svg#, #titulo#, #metafora#, #descricao#
-->
<div class="c2f-card group relative flex h-full flex-col rounded-2xl border border-white/5 bg-white/[0.03] p-8 backdrop-blur-sm transition-all duration-300 hover:border-emerald-500/40 hover:bg-emerald-500/[0.04]">
    <span class="absolute right-6 top-6 font-mono text-xs font-bold text-emerald-500/40">#indice#</span>
    <div class="flex h-14 w-14 items-center justify-center rounded-2xl bg-gradient-to-br from-emerald-500/20 to-emerald-500/5 text-emerald-300 ring-1 ring-emerald-500/30 transition-all duration-300 group-hover:scale-110 group-hover:shadow-[0_0_28px_rgba(52,211,153,0.5)]">
        #icone-svg#
    </div>
    <h3 class="mt-6 text-xl font-extrabold text-white">#titulo#</h3>
    <p class="mt-1 text-sm font-bold italic text-emerald-400/80">#metafora#</p>
    <p class="mt-4 flex-1 text-sm leading-relaxed text-slate-400">#descricao#</p>
    <div class="mt-6 h-1 w-12 rounded-full bg-gradient-to-r from-emerald-500 to-emerald-300 transition-all duration-500 group-hover:w-full"></div>
</div>
