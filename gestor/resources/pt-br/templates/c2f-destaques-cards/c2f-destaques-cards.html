<div class="mt-8 grid gap-6 sm:grid-cols-2 lg:grid-cols-3 lg:gap-5 xl:grid-cols-5" data-c2f-destaques="cards">
    <!-- item < -->
    <article class="c2f-card group relative flex h-full flex-col overflow-hidden rounded-2xl border border-white/5 bg-[#0a1510]/80 p-6 transition-all duration-300 hover:-translate-y-1.5 hover:border-emerald-500/40 hover:shadow-[0_20px_50px_-20px_rgba(16,185,129,0.45)]" data-c2f-status="@[[item#status_chave]]@">
        <div class="pointer-events-none absolute -right-16 -top-16 h-40 w-40 rounded-full bg-emerald-500/10 blur-3xl opacity-0 transition-opacity duration-500 group-hover:opacity-100"></div>
        <div class="flex items-start justify-between gap-4">
            <span class="c2f-num font-mono text-4xl font-black leading-none text-emerald-500/30 transition-colors duration-300 group-hover:text-emerald-400/60">@[[item#selo]]@</span>
            <span class="c2f-status-@[[item#status_chave]]@">@[[item#status]]@</span>
        </div>
        <h3 class="mt-5 text-lg font-extrabold leading-snug text-white"><a href="@[[item#url]]@" class="after:absolute after:inset-0 focus:outline-none">@[[item#titulo]]@</a></h3>
        <p class="mt-3 flex-1 text-sm leading-relaxed text-slate-400">@[[item#resumo]]@</p>
        <div class="mt-6 flex items-center justify-between gap-3 border-t border-white/5 pt-4">
            <span class="inline-flex min-w-0 items-center gap-1.5 text-xs font-bold text-slate-500"><svg viewBox="0 0 24 24" class="h-4 w-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span class="truncate">@[[item#categoria]]@</span></span>
            <span class="c2f-accent inline-flex shrink-0 items-center gap-1.5 text-sm font-extrabold text-emerald-300 transition-all duration-300 group-hover:gap-2.5">Abrir<svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
        </div>
    </article>
    <!-- item > -->
    <!-- no-item < -->
    <div class="col-span-full rounded-2xl border border-dashed border-white/10 p-10 text-center text-sm font-bold text-slate-500">Nenhuma publicação disponível no momento.</div>
    <!-- no-item > -->
</div>
