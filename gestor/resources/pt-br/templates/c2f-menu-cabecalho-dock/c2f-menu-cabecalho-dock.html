<!-- menu-visible < -->
<header id="c2f-header" data-c2f-header="dock" data-c2f-menu class="pointer-events-none fixed inset-x-0 top-0 z-50 px-3 pt-3 sm:px-6 sm:pt-4">
    <nav class="c2f-dock pointer-events-auto mx-auto flex max-w-5xl flex-wrap items-center justify-between gap-3 rounded-[1.75rem] border border-emerald-500/25 bg-[#0a1510]/70 px-3 py-2.5 shadow-[0_12px_40px_-20px_rgba(16,185,129,0.55)] backdrop-blur-xl lg:flex-nowrap lg:rounded-full lg:px-2.5 lg:py-2" aria-label="Navegação principal">
        <!-- Marca compacta -->
        <a href="@[[pagina#url-raiz]]@" class="group flex shrink-0 items-center gap-2.5 rounded-full py-1 pl-1 pr-3 transition-colors hover:bg-white/5">
            <span class="flex h-9 w-9 items-center justify-center rounded-full bg-gradient-to-br from-emerald-300 to-emerald-600 text-[#060e0a] shadow-[0_0_20px_rgba(16,185,129,0.55)] transition-transform duration-300 group-hover:rotate-12">
                <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 8-8"/><path d="M20 12a8 8 0 0 1-8 8"/><circle cx="12" cy="12" r="2.5"/></svg>
            </span>
            <span class="text-base font-extrabold tracking-tight text-white">Conn2Flow <span class="font-bold text-emerald-300">IA</span></span>
        </a>

        <!-- Botão do painel (mobile) -->
        <button type="button" data-c2f-menu-toggle aria-expanded="false" aria-label="Abrir menu" class="c2f-menu-toggle h-10 w-10 items-center justify-center rounded-full border border-emerald-500/30 bg-emerald-500/10 text-emerald-200 transition-colors hover:bg-emerald-500/20">
            <svg data-icon="open" viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 8h14M5 16h9"/></svg>
            <svg data-icon="close" viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="display:none"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>

        <!-- Painel deslizante (mobile) / trilho de pílulas (desktop) -->
        <div data-c2f-menu-panel class="c2f-menu-panel w-full border-t border-emerald-500/15 pb-2 pt-3 lg:w-auto lg:flex-1 lg:justify-between lg:gap-4 lg:border-0 lg:p-0">
            <ul class="c2f-menu-list lg:mx-auto lg:gap-1 lg:rounded-full lg:bg-black/20 lg:p-1">
                <!-- item < -->
                <li><a href="@[[item#url]]@" target="@[[item#target]]@" data-slug="@[[item#slug]]@" class="c2f-dock-link @[[item#css_classes]]@">@[[item#label]]@</a></li>
                <!-- item > -->
                <!-- item-parent < -->
                <li class="c2f-has-sub relative">
                    <a href="@[[item#url]]@" target="@[[item#target]]@" data-slug="@[[item#slug]]@" class="c2f-dock-link @[[item#css_classes]]@">@[[item#label]]@ <span aria-hidden="true" class="text-emerald-400">&#9662;</span></a>
                    <ul class="c2f-submenu z-20 min-w-[13rem] rounded-2xl border border-emerald-500/25 bg-[#0a1510]/95 p-2 backdrop-blur-xl lg:absolute lg:left-1/2 lg:top-full lg:mt-2 lg:-translate-x-1/2">
                        @[[item#children]]@
                    </ul>
                </li>
                <!-- item-parent > -->
                <!-- item-separator < -->
                <li aria-hidden="true" class="mx-1 h-5 w-px self-center bg-emerald-500/25"></li>
                <!-- item-separator > -->
                <!-- no-item < -->
                <li class="px-3 text-sm italic text-slate-500">Nenhum item no menu</li>
                <!-- no-item > -->
            </ul>

            <div class="c2f-menu-ctas mt-3 shrink-0 lg:mt-0 lg:gap-2">
                <a href="https://github.com/otavioserra/conn2flow-ai-workspace" target="_blank" rel="noopener" aria-label="Repositório no GitHub" class="inline-flex h-10 items-center justify-center gap-2 rounded-full border border-white/10 bg-white/5 px-4 text-sm font-bold text-slate-200 transition-colors hover:border-emerald-500/40 hover:text-white">
                    <svg viewBox="0 0 24 24" class="h-4 w-4" fill="currentColor"><path d="M12 .5C5.7.5.7 5.5.7 11.8c0 5 3.2 9.2 7.7 10.7.6.1.8-.2.8-.5v-2c-3.1.7-3.8-1.3-3.8-1.3-.5-1.3-1.2-1.7-1.2-1.7-1-.7.1-.7.1-.7 1.1.1 1.7 1.2 1.7 1.2 1 1.7 2.6 1.2 3.3.9.1-.7.4-1.2.7-1.5-2.5-.3-5.1-1.3-5.1-5.6 0-1.2.4-2.3 1.2-3-.1-.3-.5-1.5.1-3 0 0 1-.3 3.1 1.2a10.7 10.7 0 0 1 5.7 0c2.2-1.5 3.1-1.2 3.1-1.2.6 1.5.2 2.7.1 3 .8.8 1.2 1.8 1.2 3 0 4.3-2.6 5.3-5.1 5.6.4.4.8 1.1.8 2.1v3.2c0 .3.2.7.8.5 4.5-1.5 7.7-5.7 7.7-10.7C23.3 5.5 18.3.5 12 .5z"/></svg>
                    <span class="lg:sr-only">GitHub</span>
                </a>
                <a href="https://www.youtube.com/playlist?list=PLBjofG88X62Y" target="_blank" rel="noopener" class="c2f-btn-glow inline-flex h-10 items-center justify-center gap-2 rounded-full bg-emerald-500 px-5 text-sm font-extrabold text-[#060e0a] transition-all duration-300 hover:bg-emerald-400 hover:shadow-[0_0_26px_rgba(52,211,153,0.65)]">
                    <svg viewBox="0 0 24 24" class="h-4 w-4" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                    Assistir
                </a>
            </div>
        </div>
    </nav>
</header>
<!-- menu-visible > -->
