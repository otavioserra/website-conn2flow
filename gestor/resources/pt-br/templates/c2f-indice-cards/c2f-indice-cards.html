<div class="conn2flow-publisher-index" data-grupo-slug="@[[grupo_slug]]@" data-publisher-id="@[[publisher_id]]@" data-items-per-page="@[[items_per_page]]@" data-ordenacao="@[[ordenacao]]@" data-page="1">
    <div class="flex flex-col gap-3 rounded-2xl border border-white/5 bg-white/[0.02] p-3 sm:flex-row sm:items-center">
        <!-- search-input < -->
        <label class="relative min-w-0 flex-1">
            <span class="sr-only">Buscar</span>
            <svg viewBox="0 0 24 24" class="pointer-events-none absolute left-4 top-1/2 h-4 w-4 -translate-y-1/2 text-emerald-400" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <input type="search" class="publisher-index-search c2f-field" style="padding-left:2.75rem" placeholder="Buscar por título ou tema...">
        </label>
        <!-- search-input > -->
        <!-- sort-select < -->
        <label class="sm:w-56">
            <span class="sr-only">Ordenar</span>
            <select class="publisher-index-sort c2f-field">
                <option value="date_asc">Ordem da série</option>
                <option value="date_desc">Mais recentes primeiro</option>
                <option value="title_asc">Título (A-Z)</option>
                <option value="title_desc">Título (Z-A)</option>
            </select>
        </label>
        <!-- sort-select > -->
    </div>

    <!-- metrics < -->
    <p class="publisher-index-metrics mt-5 text-sm font-bold text-slate-500">Exibindo <span data-page-count class="text-emerald-300">@[[page_count]]@</span> de <span data-page-total class="text-white">@[[page_total]]@</span> publicações</p>
    <!-- metrics > -->

    <div class="publisher-index-items mt-6 grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
        <!-- item < -->
        <article class="c2f-card group relative flex h-full flex-col overflow-hidden rounded-2xl border border-white/5 bg-[#0a1510]/80 p-6 transition-all duration-300 hover:-translate-y-1.5 hover:border-emerald-500/40 hover:shadow-[0_20px_50px_-20px_rgba(16,185,129,0.45)]" data-c2f-status="@[[item#status_chave]]@">
            <div class="pointer-events-none absolute -right-16 -top-16 h-40 w-40 rounded-full bg-emerald-500/10 blur-3xl opacity-0 transition-opacity duration-500 group-hover:opacity-100"></div>
            <div class="flex items-start justify-between gap-4">
                <span class="c2f-num min-w-0 font-mono text-3xl font-black leading-none text-emerald-500/30 transition-colors duration-300 group-hover:text-emerald-400/60">@[[item#selo]]@</span>
                <span class="c2f-status-@[[item#status_chave]]@">@[[item#status]]@</span>
            </div>
            <h3 class="mt-5 text-lg font-extrabold leading-snug text-white"><a href="@[[item#url]]@" class="after:absolute after:inset-0 focus:outline-none">@[[item#titulo]]@</a></h3>
            <p class="mt-3 flex-1 text-sm leading-relaxed text-slate-400">@[[item#resumo]]@</p>
            <div class="mt-6 flex items-center justify-between gap-3 border-t border-white/5 pt-4">
                <span class="truncate text-xs font-bold text-slate-500">@[[item#categoria]]@</span>
                <span class="c2f-accent inline-flex shrink-0 items-center gap-1.5 text-sm font-extrabold text-emerald-300 transition-all duration-300 group-hover:gap-2.5">Abrir<svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
            </div>
        </article>
        <!-- item > -->
        <!-- no-item < -->
        <div class="publisher-index-empty col-span-full rounded-2xl border border-dashed border-white/10 p-10 text-center text-sm font-bold text-slate-500">Nenhuma publicação encontrada para esta busca.</div>
        <!-- no-item > -->
    </div>

    <div class="mt-10 text-center">
        <!-- load-more < -->
        <button type="button" class="publisher-index-load-more c2f-btn-glow inline-flex items-center gap-2 rounded-full border border-emerald-500/40 bg-emerald-500/10 px-7 py-3 text-sm font-extrabold text-emerald-200 transition-all duration-300 hover:bg-emerald-500 hover:text-[#060e0a]">Carregar mais</button>
        <!-- load-more > -->
    </div>
</div>
