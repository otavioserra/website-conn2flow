<!-- menu-visible < -->
<header id="c2f-header" data-c2f-header="navbar" data-c2f-menu class="fixed inset-x-0 top-0 z-50 border-b border-transparent transition-all duration-300">
    <nav class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-4 px-4 py-4 sm:px-6 lg:flex-nowrap lg:px-8" aria-label="Navegação principal">
        <!-- Logo + tag do curso -->
        <a href="@[[pagina#url-raiz]]@" class="group flex shrink-0 items-center gap-3">
            <span class="relative flex h-10 w-10 items-center justify-center rounded-xl bg-gradient-to-br from-emerald-400 to-emerald-600 text-[#060e0a] shadow-[0_0_24px_rgba(16,185,129,0.45)] transition-transform duration-300 group-hover:scale-105 group-hover:rotate-3">
                <svg viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 8-8"/><path d="M20 12a8 8 0 0 1-8 8"/><circle cx="12" cy="12" r="2.5"/><path d="M4 12h3M17 12h3"/></svg>
            </span>
            <span class="flex flex-col leading-none">
                <span class="text-lg font-extrabold tracking-tight text-white">Conn2Flow</span>
                <span class="mt-1 inline-flex w-fit items-center gap-1 rounded-full border border-emerald-500/30 bg-emerald-500/10 px-2 py-[2px] text-[10px] font-bold uppercase tracking-widest text-emerald-300">
                    <span class="h-1.5 w-1.5 rounded-full bg-emerald-400 animate-pulse"></span>Curso de IA
                </span>
            </span>
        </a>

        <!-- Botão hamburguer (mobile) -->
        <button type="button" data-c2f-menu-toggle aria-expanded="false" aria-label="Abrir menu" class="c2f-menu-toggle h-11 w-11 items-center justify-center rounded-xl border border-white/10 bg-white/5 text-slate-200 transition-colors hover:border-emerald-500/40 hover:text-white">
            <svg data-icon="open" viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
            <svg data-icon="close" viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>

        <!-- Painel: links + CTAs (drawer no mobile, linha no desktop) -->
        <div data-c2f-menu-panel class="c2f-menu-panel w-full rounded-2xl border border-emerald-500/10 bg-[#060e0a]/95 p-4 backdrop-blur-xl lg:w-auto lg:flex-1 lg:justify-between lg:gap-6 lg:rounded-none lg:border-0 lg:bg-transparent lg:p-0 lg:backdrop-blur-none">
            <ul class="c2f-menu-list lg:mx-auto lg:gap-1">
                <!-- item < -->
                <li><a href="@[[item#url]]@" target="@[[item#target]]@" data-slug="@[[item#slug]]@" class="c2f-navlink @[[item#css_classes]]@">@[[item#label]]@</a></li>
                <!-- item > -->
                <!-- item-parent < -->
                <li class="c2f-has-sub relative">
                    <a href="@[[item#url]]@" target="@[[item#target]]@" data-slug="@[[item#slug]]@" class="c2f-navlink @[[item#css_classes]]@">@[[item#label]]@ <span aria-hidden="true" class="text-emerald-400">&#9662;</span></a>
                    <ul class="c2f-submenu z-20 min-w-[13rem] rounded-xl border border-emerald-500/20 bg-[#0a1510]/95 p-2 shadow-[0_20px_50px_-20px_rgba(16,185,129,0.5)] lg:absolute lg:left-0 lg:top-full">
                        @[[item#children]]@
                    </ul>
                </li>
                <!-- item-parent > -->
                <!-- item-separator < -->
                <li aria-hidden="true" class="mx-2 select-none text-xs font-bold uppercase tracking-widest text-slate-600">@[[item#label]]@</li>
                <!-- item-separator > -->
                <!-- no-item < -->
                <li class="px-3 text-sm italic text-slate-500">Nenhum item no menu</li>
                <!-- no-item > -->
            </ul>

            <!-- CTAs -->
            <div class="c2f-menu-ctas mt-4 shrink-0 lg:mt-0 lg:gap-3">
                <a href="https://github.com/otavioserra/conn2flow-ai-workspace" target="_blank" rel="noopener" class="inline-flex items-center justify-center gap-2 rounded-xl border border-white/10 bg-white/5 px-4 py-3 text-sm font-bold text-slate-200 transition-all duration-300 hover:border-emerald-500/40 hover:bg-white/10 hover:text-white lg:rounded-full lg:py-2">
                    <svg viewBox="0 0 24 24" class="h-4 w-4" fill="currentColor"><path d="M12 .5C5.7.5.7 5.5.7 11.8c0 5 3.2 9.2 7.7 10.7.6.1.8-.2.8-.5v-2c-3.1.7-3.8-1.3-3.8-1.3-.5-1.3-1.2-1.7-1.2-1.7-1-.7.1-.7.1-.7 1.1.1 1.7 1.2 1.7 1.2 1 1.7 2.6 1.2 3.3.9.1-.7.4-1.2.7-1.5-2.5-.3-5.1-1.3-5.1-5.6 0-1.2.4-2.3 1.2-3-.1-.3-.5-1.5.1-3 0 0 1-.3 3.1 1.2a10.7 10.7 0 0 1 5.7 0c2.2-1.5 3.1-1.2 3.1-1.2.6 1.5.2 2.7.1 3 .8.8 1.2 1.8 1.2 3 0 4.3-2.6 5.3-5.1 5.6.4.4.8 1.1.8 2.1v3.2c0 .3.2.7.8.5 4.5-1.5 7.7-5.7 7.7-10.7C23.3 5.5 18.3.5 12 .5z"/></svg>
                    GitHub
                </a>
                <a href="https://www.youtube.com/playlist?list=PLBjofG88X62Y" target="_blank" rel="noopener" class="c2f-btn-glow inline-flex items-center justify-center gap-2 rounded-xl bg-emerald-500 px-5 py-3 text-sm font-extrabold text-[#060e0a] transition-all duration-300 hover:bg-emerald-400 hover:shadow-[0_0_28px_rgba(52,211,153,0.6)] lg:rounded-full lg:py-2">
                    <svg viewBox="0 0 24 24" class="h-4 w-4" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                    Assistir Grátis
                </a>
            </div>
        </div>
    </nav>
</header>
<!-- menu-visible > -->
